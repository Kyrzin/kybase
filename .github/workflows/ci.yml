name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint -- --max-warnings 0
      - run: npm test
      - run: npm run build
        env:
          # Build-time placeholders — real secrets are injected at runtime
          KYBASE_SECRET: ci-placeholder
          EMBEDDING_PROVIDER: ollama

  integration:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kybase
          POSTGRES_PASSWORD: kybase
          POSTGRES_DB: kybase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kybase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration
        env:
          DATABASE_URL: postgres://kybase:kybase@localhost:5432/kybase
