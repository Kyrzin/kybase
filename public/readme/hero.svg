<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kybase — self-hosted memory for AI agents: a markdown knowledge base with a wikilink graph, semantic search, and an MCP server.">
  <title>Kybase — self-hosted memory for AI agents</title>
  <!-- Palette comes from the app itself (globals.css / MiniGraph):
       bg #11111b · fg #cdd6f4 · blue #89b4fa · teal #94e2d5 · amber #f9e2af · muted #6c7086 -->
  <rect width="1200" height="400" rx="16" fill="#11111b"/>

  <!-- faint dot grid, as in the graph view -->
  <g fill="#252535">
    <circle cx="80" cy="60" r="1.5"/><circle cx="240" cy="120" r="1.5"/><circle cx="160" cy="330" r="1.5"/>
    <circle cx="420" cy="70" r="1.5"/><circle cx="380" cy="350" r="1.5"/><circle cx="560" cy="180" r="1.5"/>
    <circle cx="700" cy="60" r="1.5"/><circle cx="660" cy="350" r="1.5"/><circle cx="1140" cy="80" r="1.5"/>
    <circle cx="1100" cy="340" r="1.5"/><circle cx="900" cy="40" r="1.5"/><circle cx="60" cy="200" r="1.5"/>
  </g>

  <!-- ─── Left: title block ─────────────────────────────────────────── -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="4" fill="#94e2d5">SELF-HOSTED MEMORY FOR AI AGENTS</text>
    <text x="68" y="196" font-size="86" font-weight="700" fill="#cdd6f4">Kybase</text>
    <text x="72" y="248" font-size="27" fill="#a6adc8">A knowledge base you read and edit —</text>
    <text x="72" y="284" font-size="27" fill="#a6adc8">and your agent never forgets.</text>
    <text x="72" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6c7086">Next.js · PostgreSQL + pgvector · Ollama · MCP · one docker compose up</text>
  </g>

  <!-- ─── Right: the knowledge graph, drawn the way the app draws it ──
       solid edges = [[wikilinks]] · dashed teal = semantic similarity
       circles = notes (folder-colored) · amber diamond = folder -->
  <g>
    <!-- edges: solid wikilinks -->
    <g stroke="#6c7086" stroke-width="1.4" opacity="0.55" fill="none">
      <path d="M 828 208 Q 878 150 936 128"/>
      <path d="M 828 208 Q 890 240 964 250"/>
      <path d="M 936 128 Q 1010 118 1070 156"/>
      <path d="M 964 250 Q 1024 226 1070 156"/>
      <path d="M 828 208 Q 800 280 852 318"/>
    </g>
    <!-- edges: dashed semantic -->
    <g stroke="#94e2d5" stroke-width="1.4" stroke-dasharray="5 5" opacity="0.7" fill="none">
      <path d="M 936 128 Q 950 190 964 250"/>
      <path d="M 1070 156 Q 1104 230 1064 300"/>
      <path d="M 852 318 Q 950 330 1064 300"/>
    </g>
    <!-- folder node (amber diamond, as in the app) -->
    <g>
      <path d="M 1108 96 l 11 11 l -11 11 l -11 -11 z" fill="#f9e2af"/>
      <path d="M 1070 156 L 1102 112" stroke="#f9e2af" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.5"/>
    </g>
    <!-- note nodes -->
    <circle cx="936" cy="128" r="13" fill="#89b4fa" stroke="#1e2030" stroke-width="1.5"/>
    <circle cx="1070" cy="156" r="16" fill="#a6e3a1" stroke="#1e2030" stroke-width="1.5"/>
    <circle cx="964" cy="250" r="12" fill="#fab387" stroke="#1e2030" stroke-width="1.5"/>
    <circle cx="852" cy="318" r="10" fill="#cba6f7" stroke="#1e2030" stroke-width="1.5"/>
    <circle cx="1064" cy="300" r="11" fill="#f38ba8" stroke="#1e2030" stroke-width="1.5"/>
    <!-- active note: white core + ring, like the live spotlight -->
    <circle cx="828" cy="208" r="21" fill="none" stroke="#89b4fa" stroke-width="1.6" opacity="0.55"/>
    <circle cx="828" cy="208" r="14" fill="#89b4fa" stroke="#ffffff" stroke-width="2"/>
    <circle cx="823" cy="203" r="4.5" fill="#ffffff" opacity="0.85"/>

    <!-- pill labels with the [[wikilink]] motif, styled like the app's labels -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <rect x="736" y="236" width="188" height="34" rx="6" fill="#181926" stroke="#89b4fa" stroke-width="1"/>
      <text x="830" y="259" text-anchor="middle" fill="#cdd6f4">[[Agent memory]]</text>
      <rect x="998" y="180" width="204" height="32" rx="6" fill="#15161f" stroke="#313244" stroke-width="1"/>
      <text x="1100" y="202" text-anchor="middle" fill="#a6e3a1">[[Semantic search]]</text>
    </g>
  </g>
</svg>
